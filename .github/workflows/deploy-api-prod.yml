name: Deploy API (prod)

on:
  push:
    branches: [release]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-prod.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://nonda-api.nonda.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dopplerhq/cli-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        working-directory: apps/api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: doppler run -- pnpm db:migrate

      - name: Deploy to Cloudflare Workers (production)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Doppler secrets to Cloudflare Worker
        working-directory: apps/api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          doppler secrets download --no-file --format json \
            | jq 'del(.DOPPLER_PROJECT, .DOPPLER_CONFIG, .DOPPLER_ENVIRONMENT)' \
            | pnpm exec wrangler secret bulk --env production
